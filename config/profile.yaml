judge_rubric:
  positive_rules:
    - "AI, 게임개발, 보안뿐 아니라 백엔드, 프론트엔드, 클라우드, 데이터 등 일반 IT/SW 개발 직무 전반은 관심(1)으로 판정한다."
    - "인턴, 채용연계형, 부트캠프/교육뿐만 아니라 당장 지원 시기가 도래한 신입 공채도 관심(1)으로 판정한다."
    - "경희대학교 국제캠퍼스 및 소프트웨어융합학과 4학년에게 해당하는 학사 필수 일정, 졸업요건, 장학금 공지는 관심(1)으로 판정한다."
    - "성남시 또는 분당구 거주 대학생이 신청 가능한 청년 지원금, 자격증 응시료 지원, 주거/금융, 대학생 연수는 관심(1)으로 판정한다."
    - "게임 기획/그래픽·AI 융합 특강 등 SW·게임·AI 관심사와 직접 연결되는 교내외 특강은 관심(1)으로 판정한다."
  negative_rules:
    - "영업, 경영지원, 인사, 회계, 생산/품질, 기계, 화공, 바이오 등 비IT 직무 공고는 제외(0)로 판정한다."
    - "타지역(서울, 부산, 타 시군 등) 전용 및 경희대 서울캠퍼스 전용 오프라인 행사·복지는 제외(0)로 판정한다."
    - "경력 2년 이상 등 경력직 전용 채용 공고는 제외(0)로 판정한다."
    - "신입생/편입생 전용 안내 및 일반대학원 입시·조교 모집 공고는 제외(0)로 판정한다."
    - "IT·SW·게임·AI와 무관한 순수 디자인·예술·미디어·인문 특강은 제외(0)로 판정한다."

